name: Matchline verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Java tests and build BOTH delivery formats
        run: |
          chmod +x ./gradlew
          ./gradlew clean test installDist bootJar --no-daemon --max-workers=1 --console=plain
      - name: Browser logic tests
        run: node --test ui/tests/*.test.mjs
      - name: Keep old CLI and crash-recovery smoke checks
        run: |
          ./build/install/matchline/bin/matchline --self-check
          ./build/install/matchline/bin/matchline --recovery-demo
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
  docker:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build new Spring Boot image
        run: docker build -t matchline:spring-ci .
      - name: Start isolated Spring public demo and run release smoke
        run: |
          docker run -d --name matchline-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges --memory 512m \
            -p 127.0.0.1:18080:8080 -e PORT=8080 \
            -e MATCHLINE_PUBLIC_DEMO=true \
            -e MATCHLINE_EMBED_ORIGIN=https://portfolio.jhethia.workers.dev \
            matchline:spring-ci
          trap 'docker logs matchline-ci || true; docker rm -f matchline-ci || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          MATCHLINE_SPRING_BASE=http://127.0.0.1:18080 bash scripts/smoke-spring-release.sh
      - name: Build old CLI image for a documented rollback path
        run: |
          docker build -f Dockerfile.legacy -t matchline:legacy-ci .
          docker run --rm matchline:legacy-ci --self-check
