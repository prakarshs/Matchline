# Render blueprint for the Spring Boot public-demo image. No paid disk or external service.
# Preserve the exact portfolio origin in Render's service Environment settings.
services:
  - type: web
    name: matchline-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      - key: MATCHLINE_HTTP_HOST
        value: 0.0.0.0
      - key: MATCHLINE_PUBLIC_DEMO
        value: "true"
      # Set MATCHLINE_EMBED_ORIGIN=https://portfolio.jhethia.workers.dev
      # in the existing Render service's Environment page. No trailing slash.
      # Do not enable journaling, reset, CORS or a persistent disk on the Free demo.
