services:
  matchline-smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["--self-check"]

  matchline-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["--serve"]
    environment:
      MATCHLINE_HTTP_HOST: 0.0.0.0
      MATCHLINE_HTTP_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
# This example API is volatile, with no reset token and no cross-origin access.
