services:
  # The CLI self-check belongs to the legacy distribution, not the Spring JAR.
  matchline-smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: Dockerfile.legacy
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["--self-check"]

  matchline-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 8080
      MATCHLINE_HTTP_HOST: 0.0.0.0
      MATCHLINE_PUBLIC_DEMO: "false"
    ports:
      - "127.0.0.1:8080:8080"
    # Local mode: one volatile writer and locally accessible Actuator exporter.

  matchline-public-demo:
    profiles: ["public-demo"]
    build:
      context: .
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 8080
      MATCHLINE_HTTP_HOST: 0.0.0.0
      MATCHLINE_PUBLIC_DEMO: "true"
      MATCHLINE_EMBED_ORIGIN: ${MATCHLINE_EMBED_ORIGIN:-}
    ports:
      - "127.0.0.1:${MATCHLINE_PUBLIC_HOST_PORT:-8081}:8080"
    # Safe public mode: isolated volatile books; exporter blocked by request guard.

  matchline-legacy-public:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.legacy
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      MATCHLINE_HTTP_HOST: 0.0.0.0
      MATCHLINE_HTTP_PORT: 8080
      MATCHLINE_PUBLIC_DEMO: "true"
      MATCHLINE_EMBED_ORIGIN: ${MATCHLINE_EMBED_ORIGIN:-}
    ports:
      - "127.0.0.1:${MATCHLINE_PUBLIC_HOST_PORT:-8081}:8080"
    # Public-demo profile runs locally at 8081 with isolated ephemeral sessions.
