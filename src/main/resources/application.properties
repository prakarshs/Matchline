# Spring migration 01: isolated local HTTP shell. Legacy --serve remains on :8080.
# Override SERVER_PORT for a second local listener, or PORT once Spring is deployed.
server.address=${MATCHLINE_HTTP_HOST:127.0.0.1}
server.port=${SERVER_PORT:${PORT:8082}}

# Spring Actuator health endpoint and Prometheus *exposition*. This is NOT a Grafana dashboard.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator
