# Spring migration 01: isolated local HTTP shell. Legacy --serve remains on :8080.
# Override SERVER_PORT for a second local listener, or PORT once Spring is deployed.
server.address=${MATCHLINE_HTTP_HOST:127.0.0.1}
server.port=${SERVER_PORT:${PORT:8082}}

# Spring Actuator health endpoint and Prometheus *exposition*. This is NOT a Grafana dashboard.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# One Spring-owned LOCAL volatile writer (session-free development mode).
# Opt-in public demo uses isolated, capped ephemeral writers from the verified legacy session policy.
# This does NOT enable Spring journal recovery; Render still uses the legacy adapter until S05.
matchline.demo.enabled=${MATCHLINE_PUBLIC_DEMO:false}
matchline.demo.embed-origin=${MATCHLINE_EMBED_ORIGIN:}
matchline.engine.instrument=DEMO
matchline.engine.queue-capacity=1024
matchline.engine.max-resting-orders=50000
matchline.engine.max-order-ids=1000000
